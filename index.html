<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISET Rosso - Consultation des notes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <div class="container">
        <h1>ISET Rosso</h1>
        <p>Institut Supérieur d'Enseignement Technologique</p>
      </div>
    </header>

    <div class="main-content">
      <div class="container">
        <div id="annonceContainer" class="annonce-container"></div>

        <div class="result-card">
          <h2 class="section-title">Consulter votre résultat</h2>

          <div class="dept-selector">
            <button class="dept-btn" data-dept="PPV">PPV</button>
            <button class="dept-btn" data-dept="TC">TC</button>
            <button class="dept-btn" data-dept="GAB">GAB</button>
            <button class="dept-btn" data-dept="GEM">GEM</button>
            <button class="dept-btn" data-dept="PSA">PSA</button>
            <button class="dept-btn" data-dept="STA">STA</button>
          </div>

          <div class="search-box">
            <input
              type="text"
              id="studentIdInput"
              placeholder="Entrez votre numéro d'étudiant..."
            />
            <button id="searchBtn">Rechercher</button>
          </div>

          <div id="studentResultContainer" style="display: none"></div>
          <div id="noResultMessage" style="display: none" class="empty-state">

              Vérifiez votre numéro d'étudiant et le département sélectionné
            </p>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>© 2026 Institut Supérieur d'Enseignement Technologique de Rosso</p>
    </footer>

    <script>
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        child,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      // ============================================================
      // Firebase Configuration
      // ============================================================
      const firebaseConfig = {
        apiKey: "AIzaSyDnrW6WnmbEFpbWzlW9IGglxAafajt2Kyo",
        authDomain: "iset-b9974.firebaseapp.com",
        projectId: "iset-b9974",
        storageBucket: "iset-b9974.firebasestorage.app",
        messagingSenderId: "1054170284751",
        appId: "1:1054170284751:web:8f02232478430d5ae2adba",
        databaseURL: "https://iset-b9974-default-rtdb.firebaseio.com/",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);

      // ============================================================
      // Department and Semester Structure
      // ============================================================
      const DEPT_SEMESTERS = {
        TC: ["S1", "S2"],
        PPV: ["S3", "S4", "S5", "S6"],
        GAB: ["S3", "S4", "S5", "S6"],
        GEM: ["S3", "S4", "S5", "S6"],
        PSA: ["S3", "S4", "S5", "S6"],
        STA: ["S3", "S4", "S5", "S6"],
      };

      // Subjects without TP
      const DEFAULT_NO_TP = [
        "Anglais",
        "Anglais_2",
        "Francais",
        "Francais_2",
        "Francais_s3",
        "Francais_GAB_S3",
        "Math_et_Statistique",
        "Economie",
        "Economie_GAB",
        "Vulgarisation",
      ];

      // Dynamic structures loaded from Firebase
      let MODULES_STRUCTURE = {};
      let CREDITS_STRUCTURE = {};
      let NO_TP_SUBJECTS = [...DEFAULT_NO_TP];

      // Current state
      let selectedDept = "PPV";
      let pdfState = null;

      // ============================================================
      // Helper Functions
      // ============================================================
      function hasTP(subject) {
        return !NO_TP_SUBJECTS.includes(subject);
      }

      function displaySubjectName(subject) {
        if (!subject) return "";
        return subject
          .replace(/_/g, " ")
          .replace(/I_/g, "I.")
          .replace(/et_/g, "et ")
          .replace(/l eau/g, "l'eau");
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // ============================================================
      // Load Structures from Firebase
      // ============================================================
      async function loadStructures() {
        try {
          const structSnap = await get(child(ref(db), "structure"));
          if (structSnap.exists()) {
            const structData = structSnap.val();
            MODULES_STRUCTURE = structData;

            // Extract credits
            CREDITS_STRUCTURE = {};
            for (let dept in structData) {
              CREDITS_STRUCTURE[dept] = {};
              for (let sem in structData[dept]) {
                CREDITS_STRUCTURE[dept][sem] = {};
                for (let modKey in structData[dept][sem]) {
                  const module = structData[dept][sem][modKey];
                  if (module.subjectCredits) {
                    Object.assign(
                      CREDITS_STRUCTURE[dept][sem],
                      module.subjectCredits,
                    );
                  }
                  if (module.subjects) {
                    for (let subject of module.subjects) {
                      if (!CREDITS_STRUCTURE[dept][sem][subject]) {
                        CREDITS_STRUCTURE[dept][sem][subject] = 3;
                      }
                    }
                  }
                }
              }
            }
          }

          // Load no-TP subjects
          const noTPSnap = await get(child(ref(db), "no_tp_subjects"));
          if (noTPSnap.exists()) {
            NO_TP_SUBJECTS = [
              ...new Set([...DEFAULT_NO_TP, ...noTPSnap.val()]),
            ];
          }
        } catch (error) {
          console.error("Error loading structures:", error);
        }
      }

      // ============================================================
      // Get Subjects for Department and Semester
      // ============================================================
      function getSubjectsForDeptSem(dept, sem) {
        const modules = MODULES_STRUCTURE[dept]?.[sem] || {};
        const subjects = [];
        for (let modKey in modules) {
          const module = modules[modKey];
          if (module.subjects) {
            for (let subject of module.subjects) {
              if (!subjects.includes(subject)) {
                subjects.push(subject);
              }
            }
          }
        }
        return subjects;
      }

      // ============================================================
      // Calculate Results
      // ============================================================
      function calculateResults(notes, dept, sem) {
        const modules = MODULES_STRUCTURE[dept]?.[sem] || {};
        const allSubjects = getSubjectsForDeptSem(dept, sem);

        if (allSubjects.length === 0) {
          return null;
        }

        // Calculate subject averages
        const subjectAvg = {};
        const subjectSR = {};

        for (let subject of allSubjects) {
          const n = notes[subject] || {};
          const exam = n["Examen"] || 0;
          const cc = n["Controle continu"] || n["Contrôle continu"] || 0;
          const tp = n["TP"] || 0;
          const ratt = n["Rattrapage"];

          const useSR = ratt !== undefined && ratt > exam;
          subjectSR[subject] = useSR;
          const finalGrade = useSR ? ratt : exam;

          if (hasTP(subject)) {
            subjectAvg[subject] = (tp + cc * 2 + finalGrade * 3) / 6;
          } else {
            subjectAvg[subject] = (cc * 2 + finalGrade * 3) / 5;
          }
        }

        // Calculate module averages
        const moduleAvg = {};
        for (let modKey in modules) {
          const module = modules[modKey];
          let totalWeighted = 0;
          let totalCredits = 0;

          for (let subject of module.subjects || []) {
            const credit = CREDITS_STRUCTURE[dept]?.[sem]?.[subject] || 3;
            totalWeighted += (subjectAvg[subject] || 0) * credit;
            totalCredits += credit;
          }
          moduleAvg[modKey] =
            totalCredits > 0 ? totalWeighted / totalCredits : 0;
        }

        // Calculate overall average
        let totalWeighted = 0;
        let totalCredits = 0;
        for (let subject of allSubjects) {
          const credit = CREDITS_STRUCTURE[dept]?.[sem]?.[subject] || 3;
          totalWeighted += (subjectAvg[subject] || 0) * credit;
          totalCredits += credit;
        }
        const overallAvg = totalCredits > 0 ? totalWeighted / totalCredits : 0;

        // Calculate subject status (C/NC)
        const subjectStatus = {};
        for (let modKey in modules) {
          const moduleAvgVal = moduleAvg[modKey];
          for (let subject of modules[modKey].subjects || []) {
            if (subjectAvg[subject] >= 10) {
              subjectStatus[subject] = "C";
            } else if (subjectAvg[subject] >= 7 && moduleAvgVal >= 10) {
              subjectStatus[subject] = "C";
            } else {
              subjectStatus[subject] = "NC";
            }
          }
        }

        // Calculate module status (V/NV)
        const moduleStatus = {};
        const moduleCredits = {};
        for (let modKey in modules) {
          let allC = true;
          let earnedCredits = 0;

          for (let subject of modules[modKey].subjects || []) {
            const credit = CREDITS_STRUCTURE[dept]?.[sem]?.[subject] || 3;
            if (subjectStatus[subject] === "C") {
              earnedCredits += credit;
            } else {
              allC = false;
            }
          }
          moduleCredits[modKey] = earnedCredits;

          if (moduleAvg[modKey] >= 10 && allC) {
            moduleStatus[modKey] = "V";
          } else {
            moduleStatus[modKey] = "NV";
          }
        }

        // Determine semester status
        const hasNV = Object.values(moduleStatus).some(
          (status) => status === "NV",
        );
        const semesterStatus =
          overallAvg >= 10 && !hasNV ? "Validé" : "Non Validé";
        const hasSR = Object.values(subjectSR).some((v) => v === true);

        return {
          overallAvg: Math.round(overallAvg * 100) / 100,
          semesterStatus: semesterStatus,
          moduleAvg: moduleAvg,
          moduleStatus: moduleStatus,
          moduleCredits: moduleCredits,
          subjectAvg: subjectAvg,
          subjectStatus: subjectStatus,
          hasSR: hasSR,
          modules: modules,
        };
      }

      // ============================================================
      // Build Results Table HTML
      // ============================================================
      function buildResultsHTML(
        studentId,
        studentName,
        notes,
        results,
        dept,
        sem,
      ) {
        const showSR = results.hasSR;
        const colspanVal = showSR ? 6 : 5;

        let html = `
    <div style="overflow-x:auto;">
    <table class="releve-table">
      <thead>
        <tr>
          <th>Numéro</th>
          <th>Nom et Prénom</th>
          <th>TP</th>
          <th>CC</th>
          <th>Examen</th>
          ${showSR ? "<th>SR</th>" : ""}
          <th>NF°</th>
          <th>Crédit</th>
          <th>Obs</th>
        </tr>
      </thead>
      <tbody>
        <tr class="student-info-row">
          <td>${escapeHtml(studentId)}</td>
          <td style="text-align:left;">${escapeHtml(studentName)}</td>
          <td></td>
          <td></td>
          <td></td>
          ${showSR ? "<td></td>" : ""}
          <td></td>
          <td></td>
          <td></td>
        </tr>
  `;

        for (let modKey in results.modules) {
          const module = results.modules[modKey];
          const moduleLabel = modKey.replace(/_[A-Z]+$/, "");

          html += `
        <tr class="module-row">
          <td>${escapeHtml(moduleLabel)}</td>
          <td style="text-align:left;">${escapeHtml(module.name)}</td>
          <td></td>
          <td></td>
          <td></td>
          ${showSR ? "<td></td>" : ""}
          <td style="font-weight:bold;">${Math.round(results.moduleAvg[modKey] * 100) / 100}</td>
          <td>${results.moduleCredits[modKey].toFixed(1)}</td>
          <td class="${results.moduleStatus[modKey] === "V" ? "status-V" : "status-NV"}">${results.moduleStatus[modKey]}</td>
        </tr>
    `;

          for (let subject of module.subjects || []) {
            const n = notes[subject] || {};
            const tpVal = hasTP(subject)
              ? n["TP"] !== undefined
                ? n["TP"].toFixed(2)
                : ""
              : "";
            const ccVal =
              n["Controle continu"] !== undefined
                ? n["Controle continu"].toFixed(2)
                : n["Contrôle continu"] !== undefined
                  ? n["Contrôle continu"].toFixed(2)
                  : "";
            const examVal =
              n["Examen"] !== undefined ? n["Examen"].toFixed(2) : "";
            const rattVal =
              n["Rattrapage"] !== undefined ? n["Rattrapage"].toFixed(2) : "";
            const credit = CREDITS_STRUCTURE[dept]?.[sem]?.[subject] || 3;

            html += `
        <tr class="subject-row">
          <td></td>
          <td style="text-align:left; padding-left:30px;">${escapeHtml(displaySubjectName(subject))}</td>
          <td>${tpVal}</td>
          <td>${ccVal}</td>
          <td>${examVal}</td>
          ${showSR ? `<td>${rattVal}</td>` : ""}
          <td style="font-weight:bold;">${Math.round(results.subjectAvg[subject] * 100) / 100}</td>
          <td>${credit.toFixed(1)}</td>
          <td class="${results.subjectStatus[subject] === "C" ? "status-C" : "status-NC"}">${results.subjectStatus[subject]}</td>
        </tr>
      `;
          }
        }

        html += `
        <tr class="moyenne-row">
          <td colspan="${colspanVal}" style="text-align:right; font-weight:bold;">Moyenne Semestre :</td>
          <td style="font-weight:bold;">${results.overallAvg}</td>
          <td></td>
          <td class="${results.semesterStatus === "Validé" ? "status-V" : "status-NV"}" style="font-weight:bold;">${results.semesterStatus}</td>
        </tr>
      </tbody>
    </table>
    </div>
  `;

        return html;
      }

      // ============================================================
      // Generate PDF
      // ============================================================
      window.generatePDF = function () {
        if (!pdfState) {
          alert("Données non disponibles.");
          return;
        }

        const { notes, results, studentId, studentName, dept, sem } = pdfState;
        const showSR = results.hasSR;
        const currentYear = new Date().getFullYear();
        const academicYear = `${currentYear - 1}-${currentYear}`;

        let content = `
    <div style="padding:15mm 10mm 10mm 10mm; font-family:Arial,Helvetica,sans-serif; font-size:11pt;">
      <div style="font-weight:bold; font-size:12pt; margin-bottom:5px;">Institut Supérieur d'Enseignement Technologique de Rosso</div>
      <div style="display:flex; justify-content:space-between; margin-top:8px;">
        <span style="font-weight:bold; font-size:14pt;">Résultats du ${escapeHtml(sem)} — ${escapeHtml(dept)}</span>
        <span>Année Universitaire : ${academicYear}</span>
      </div>
      <table style="width:100%; border-collapse:collapse; border:1px solid #000; font-size:10pt; margin-top:10px;">
        <thead>
          <tr style="background:#e8f4e8;">
            <th style="border:1px solid #000; padding:3px; text-align:center;">Numéro</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">Nom et Prénom</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">TP</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">CC</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">Examen</th>
            ${showSR ? '<th style="border:1px solid #000; padding:3px; text-align:center;">SR</th>' : ""}
            <th style="border:1px solid #000; padding:3px; text-align:center;">NF°</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">Crédit</th>
            <th style="border:1px solid #000; padding:3px; text-align:center;">Obs</th>
           </tr>
        </thead>
        <tbody>
          <tr style="background:#f0f8ff; font-weight:bold;">
            <td style="border:1px solid #000; padding:4px; text-align:center;">${escapeHtml(studentId)}</td>
            <td style="border:1px solid #000; padding:4px; text-align:left;">${escapeHtml(studentName)}</td>
            <td style="border:1px solid #000; padding:4px;"></td>
            <td style="border:1px solid #000; padding:4px;"></td>
            <td style="border:1px solid #000; padding:4px;"></td>
            ${showSR ? '<td style="border:1px solid #000; padding:4px;"></td>' : ""}
            <td style="border:1px solid #000; padding:4px;"></td>
            <td style="border:1px solid #000; padding:4px;"></td>
            <td style="border:1px solid #000; padding:4px;"></td>
           </tr>
  `;

        for (let modKey in results.modules) {
          const module = results.modules[modKey];
          const moduleLabel = modKey.replace(/_[A-Z]+$/, "");

          content += `
          <tr style="background:#d4edda; font-weight:bold;">
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; border-left:1px solid #000; padding:2px; text-align:center;">${escapeHtml(moduleLabel)}</td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px; text-align:left;">${escapeHtml(module.name)}</td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px;"></td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px;"></td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px;"></td>
            ${showSR ? '<td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px;"></td>' : ""}
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px; font-weight:bold; text-align:center;">${Math.round(results.moduleAvg[modKey] * 100) / 100}</td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; padding:2px; text-align:center;">${results.moduleCredits[modKey].toFixed(1)}</td>
            <td style="border:none; border-top:1px solid #000; border-bottom:1px solid #000; border-right:1px solid #000; padding:2px; text-align:center;">${results.moduleStatus[modKey]}</td>

          for (let subject of module.subjects || []) {

                : n["Contrôle continu"] !== undefined
                  ? n["Contrôle continu"].toFixed(2)
                  : "";
            const examVal =
              n["Examen"] !== undefined ? n["Examen"].toFixed(2) : "";
            const rattVal =
              n["Rattrapage"] !== undefined ? n["Rattrapage"].toFixed(2) : "";

            <td style="border:1px solid #000; padding:1px; text-align:center;">${tpVal}</td>
            <td style="border:1px solid #000; padding:1px; text-align:center;">${ccVal}</td>
            <td style="border:1px solid #000; padding:1px; text-align:center;">${examVal}</td>

          .then(() => document.body.removeChild(el))
          .catch((err) => {

            alert("Erreur lors de la génération du PDF.");

          });

      // ============================================================
      // Search Student Results
      // ============================================================
      window.searchStudentResult = async function () {
        const studentId = document
          .getElementById("studentIdInput")
          .value.trim();
        const container = document.getElementById("studentResultContainer");
        const noResult = document.getElementById("noResultMessage");
        const dept = selectedDept;

        if (!studentId) {
          alert("Veuillez entrer votre numéro d'étudiant");
          return;
        }

        pdfState = null;
        container.innerHTML = '<div class="loading">Chargement...</div>';
        container.style.display = "block";
        noResult.style.display = "none";

        const semesters = DEPT_SEMESTERS[dept] || [];
        let foundData = null;
        let foundSem = null;

        try {
          // Search through all semesters for this department
          for (let sem of semesters) {
            const snapshot = await get(
              child(ref(db), `results/${dept}/${sem}/${studentId}`),
            );
            if (snapshot.exists()) {
              foundData = snapshot.val();
              foundSem = sem;
              break;
            }
          }

          if (!foundData) {
            container.style.display = "none";
            noResult.style.display = "block";
            return;
          }

          // Extract name and notes
          let studentName = "";
          const notes = {};

          for (let key in foundData) {
            const entry = foundData[key];
            if (entry.name && !studentName) {
              studentName = entry.name;
            }
            if (entry.subject) {
              const subject = entry.subject;
              if (!notes[subject]) {
                notes[subject] = {};
              }
              notes[subject][entry.type] = entry.grade;
            }
          }

          // Get required subjects for this department and semester
          const requiredSubjects = getSubjectsForDeptSem(dept, foundSem);

          // Check if all required data is present
          let complete = true;
          for (let subject of requiredSubjects) {
            const subjectNotes = notes[subject] || {};
            if (!subjectNotes["Examen"]) {
              complete = false;
              break;
            }
            if (
              !subjectNotes["Controle continu"] &&
              !subjectNotes["Contrôle continu"]
            ) {
              complete = false;
              break;
            }
            if (hasTP(subject) && !subjectNotes["TP"]) {
              complete = false;
              break;
            }
          }

          let html = `
      <div class="student-header">
        <h3>${escapeHtml(studentName || "Étudiant")}</h3>
        <p>Numéro: ${escapeHtml(studentId)} | Département: ${dept} | Semestre: ${foundSem}</p>
      </div>
    `;

          if (complete && requiredSubjects.length > 0) {
            const results = calculateResults(notes, dept, foundSem);
            if (results) {
              pdfState = {
                notes,
                results,
                studentId,
                studentName,
                dept,
                sem: foundSem,
              };
              html += buildResultsHTML(
                studentId,
                studentName,
                notes,
                results,
                dept,
                foundSem,
              );
              html += `
          <div style="text-align:center; margin-top:1rem;">
            <button class="pdf-link" onclick="generatePDF()">Télécharger mon relevé PDF</button>
          </div>
        `;
            } else {
              html +=
                '<div class="neutral-message">Impossible de calculer les résultats.</div>';
            }
          } else {
            // Show partial results
            html +=
              '<div class="neutral-message">Les résultats ne sont pas encore finalisés. Voici les notes disponibles:</div>';

            // Show available grades
            for (let subject in notes) {
              const subjectNotes = notes[subject];
              html += `
          <h4 style="margin-top:1rem; color:#2c5f2d;">${escapeHtml(displaySubjectName(subject))}</h4>
          <table class="releve-table" style="width:100%; margin-bottom:1rem;">
            <thead>
              <tr>
                <th>Type</th>
                <th>Note</th>
              </tr>
            </thead>
            <tbody>
        `;
              for (let type in subjectNotes) {
                html += `
            <tr>
              <td>${escapeHtml(type)}</td>
              <td>${subjectNotes[type]}</td>
            </tr>
          `;
              }
              html += "</tbody></table>";
            }
          }

          container.innerHTML = html;
        } catch (error) {
          console.error("Search error:", error);
          container.innerHTML = `
      <div class="error-state">
        <h3>Erreur de connexion</h3>
        <p>Veuillez vérifier votre connexion internet et réessayer.</p>
        <button onclick="searchStudentResult()">Réessayer</button>
      </div>
    `;
          container.style.display = "block";
          noResult.style.display = "none";
        }
      };

      // ============================================================
      // Select Department
      // ============================================================
      function selectDept(dept) {
        selectedDept = dept;
        document.querySelectorAll(".dept-btn").forEach((btn) => {
          if (btn.getAttribute("data-dept") === dept) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        // Clear previous results
        const container = document.getElementById("studentResultContainer");
        const noResult = document.getElementById("noResultMessage");
        container.style.display = "none";
        container.innerHTML = "";
        noResult.style.display = "none";
        document.getElementById("studentIdInput").value = "";
      }

      // ============================================================
      // Load Announcement
      // ============================================================
      async function loadAnnouncement() {
        try {
          const snapshot = await get(child(ref(db), "annonces/active"));
          const container = document.getElementById("annonceContainer");

          if (!snapshot.exists()) {
            container.innerHTML = "";
            return;
          }

          const annonce = snapshot.val();
          if (!annonce.texte) {
            container.innerHTML = "";
            return;
          }

          // Check expiration
          if (annonce.expiration && Date.now() > annonce.expiration) {
            container.innerHTML = "";
            return;
          }

          const expirationDate = new Date(
            annonce.expiration,
          ).toLocaleDateString("fr-FR");
          container.innerHTML = `
      <div class="annonce-bloc">
        <div style="flex:1;">
          <span class="annonce-icone">📢</span>
          <span class="annonce-texte"><strong>Annonce :</strong> ${escapeHtml(annonce.texte)}</span>
          <div class="annonce-date">Visible jusqu'au ${expirationDate}</div>
        </div>
      </div>
    `;
        } catch (error) {
          console.error("Error loading announcement:", error);
        }
      }

      // ============================================================
      // Event Listeners and Initialization
      // ============================================================
      function setupEventListeners() {
        // Department buttons
        document.querySelectorAll(".dept-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const dept = btn.getAttribute("data-dept");
            selectDept(dept);
          });
        });

        // Search button
        document.getElementById("searchBtn").addEventListener("click", () => {
          searchStudentResult();
        });

        // Enter key in input
        document
          .getElementById("studentIdInput")
          .addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
              searchStudentResult();
            }
          });
      }

      async function init() {
        await loadStructures();
        setupEventListeners();
        await loadAnnouncement();

        // Set default active department button
        document.querySelectorAll(".dept-btn").forEach((btn) => {
          if (btn.getAttribute("data-dept") === selectedDept) {
            btn.classList.add("active");
          }
        });
      }

      // Start the application
      init();
    </script>
  </body>
</html>
