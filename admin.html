<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESSAV Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f5f9;
      color: #1e293b;
      padding: 20px;
    }
    .container { max-width: 950px; margin: 0 auto; }
    header {
      background: linear-gradient(135deg, #003F6B, #0077B6);
      color: white;
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    header h1 { font-size: 22px; font-weight: 700; }
    header span { font-size: 13px; opacity: 0.85; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      font-size: 16px;
      color: #0077B6;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e0f2fe;
    }
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .form-group { flex: 1; min-width: 180px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    select:focus, input:focus { border-color: #0077B6; }
    button {
      background: #0077B6;
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #005a8a; }
    button.danger {
      background: #dc2626;
      padding: 6px 12px;
      font-size: 12px;
    }
    button.danger:hover { background: #b91c1c; }
    .files-list { max-height: 420px; overflow-y: auto; }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      gap: 10px;
    }
    .file-item:last-child { border-bottom: none; }
    .file-info { flex: 1; }
    .file-name { font-weight: 600; font-size: 14px; }
    .file-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 6px;
    }
    .badge.cours { background: #dbeafe; color: #1d4ed8; }
    .badge.td { background: #dcfce7; color: #15803d; }
    .badge.devoirs { background: #fef9c3; color: #a16207; }
    .badge.examens { background: #fee2e2; color: #b91c1c; }
    .empty { text-align: center; padding: 40px; color: #94a3b8; }
    .status {
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .status.success { background: #dcfce7; color: #15803d; display: block; }
    .status.error { background: #fee2e2; color: #b91c1c; display: block; }
    #gemAspectGroup { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ESSAV Admin</h1>
      <span>Gestion des fichiers académiques</span>
    </header>

    <div id="status" class="status"></div>

    <div class="card">
      <h2>Ajouter un fichier</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Matière</label>
          <select id="subject">
            <optgroup label="S1">
              <option value="Math">Mathématiques</option>
              <option value="Physique">Physique</option>
              <option value="Chimie">Chimie</option>
              <option value="Anglais">Anglais</option>
              <option value="Francais">Français</option>
              <option value="Biologie">Biologie</option>
              <option value="Microbiologie">Microbiologie</option>
              <option value="Genetique">Génétique</option>
              <option value="Informatique">Informatique</option>
              <option value="Statistique">Statistique</option>
            </optgroup>

            <optgroup label="S2">
              <option value="Francais2">Français 2</option>
              <option value="Anglais2">Anglais 2</option>
              <option value="GEM">GEM (S2 - Aspects)</option>
              <option value="GAB">GAB</option>
              <option value="PPV">PPV</option>
              <option value="TIC">TIC</option>
              <option value="STA">STA</option>
              <option value="PSA">PSA</option>
            </optgroup>

            <optgroup label="S3 - PPV">
              <option value="Francais3">Français 3</option>
              <option value="EconomieGestion">Économie et Gestion</option>
              <option value="Agronomie">Agronomie</option>
              <option value="Horticulture">Horticulture</option>
              <option value="Pesticides">Pesticides</option>
              <option value="Entomologie">Entomologie</option>
              <option value="ScienceSols">Science des Sols</option>
              <option value="SciencePlantes">Science des Plantes</option>
            </optgroup>

            <optgroup label="S3 - GAB">
              <option value="Francais3">Français 3</option>
              <option value="EconomieGestion">Économie et Gestion</option>
              <option value="ResistanceMateriaux">Résistance de matériaux</option>
              <option value="EnergieRenouvelable">Énergie renouvelable</option>
              <option value="Environnement">Environnement</option>
              <option value="Topographie">Topographie</option>
              <option value="DAO">DAO</option>
              <option value="MecaniqueFluides">Mécanique de fluides</option>
              <option value="ChimieEau">Chimie de l'eau</option>
            </optgroup>

            <optgroup label="S3 - GEM">
              <option value="Automatique">Automatique</option>
              <option value="Automatisme">Automatisme</option>
              <option value="ProcedeFabrication">Procédé de fabrication mécanique</option>
              <option value="Electronique">Électronique</option>
              <option value="Francais3">Français 3</option>
              <option value="EconomieGestion">Économie et Gestion</option>
              <option value="DessinIndustriel">Dessin industriel</option>
              <option value="ResistanceMateriauxGEM">Résistance de matériaux (GEM)</option>
              <option value="SchemasCablage">Schémas et câblage électrique</option>
            </optgroup>

            <optgroup label="S4 - PPV">
              <option value="Vulgarisation">Vulgarisation</option>
              <option value="TechniquePropagation">Technique de propagation</option>
              <option value="TechniqueIrrigation">Technique d'irrigation</option>
              <option value="Ecophysiologie">Ecophysiologie végétale</option>
              <option value="BiochimieStructurale">Biochimie structurale</option>
              <option value="FertiliteSol">Fertilité du sol</option>
              <option value="MethodesDiagnostic">Méthodes de diagnostic</option>
              <option value="Malherbologie">Malherbologie</option>
              <option value="BesoinEau">Besoin en eau</option>
            </optgroup>

            <optgroup label="S4 - GEM">
              <option value="Vulgarisation">Vulgarisation</option>
              <option value="SciencesMateriaux">Sciences de matériaux</option>
              <option value="TechnologieConstruction">Technologie de construction mécanique</option>
              <option value="Metrologie">Métrologie capteur instrumentation</option>
              <option value="Refrigeration">Réfrigération climatisation ventilation</option>
              <option value="Electrotechnique">Électrotechnique</option>
              <option value="MoteurCombustion">Moteur à combustion interne</option>
            </optgroup>

            <optgroup label="S5 - PPV">
              <option value="DroitSanteSecurite">Droit Santé et sécurité au travail</option>
              <option value="TechniqueGestionEntrepreneuriat">Technique de gestion et entreprenariat</option>
              <option value="SystemeProduction">Système de Production</option>
              <option value="Arboriculture">Arboriculture</option>
              <option value="ConduiteCalibrage">Conduite et Calibrage</option>
              <option value="Phytopathologie1">Phytopathologie 1</option>
              <option value="GestionConservationSolEau">Gestion et conservation du sol et de l'eau</option>
              <option value="EnnemisCultures">Ennemis des cultures et lutte intégrée</option>
              <option value="PaysageCulturesOrnementales">Intro au paysage et cultures ornementales</option>
            </optgroup>

            <optgroup label="S6 - PPV">
              <option value="RedactionRapports">Rédaction et édition des rapports</option>
              <option value="AmeliorationGenetique">Amélioration génétique des plantes et biotechnologie</option>
              <option value="Agroenvironnement">Agroenvironnement et agriculture de précision</option>
              <option value="Phytopathologie2">Phytopathologie 2</option>
              <option value="AdaptationClimat">Adaptation au changement climatique et agriculture durable</option>
              <option value="AmenagementPaysager">Aménagement paysager et poste récolte</option>
            </optgroup>
          </select>
        </div>

        <div class="form-group" id="gemAspectGroup">
          <label>Aspect GEM (S2 seulement)</label>
          <select id="gemAspect">
            <option value="Dessin">Dessin</option>
            <option value="Electricite">Électricité</option>
          </select>
        </div>

        <div class="form-group">
          <label>Type</label>
          <select id="fileType">
            <option value="Cours">Cours</option>
            <option value="TD">TD</option>
            <option value="Devoirs">Devoirs</option>
            <option value="Examens">Examens</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nom du fichier</label>
          <input type="text" id="fileName" placeholder="Ex: Cours 1 - Introduction.pdf">
        </div>
        <div class="form-group">
          <label>Lien Google Drive</label>
          <input type="text" id="fileUrl" placeholder="https://drive.google.com/file/d/...">
        </div>
      </div>

      <button onclick="addFile()">Ajouter le fichier</button>
    </div>

    <div class="card">
      <h2>Fichiers existants</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Filtrer par matière</label>
          <select id="filterSubject" onchange="loadFiles()">
            <option value="">-- Toutes --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Filtrer par type</label>
          <select id="filterType" onchange="loadFiles()">
            <option value="">-- Tous --</option>
            <option value="Cours">Cours</option>
            <option value="TD">TD</option>
            <option value="Devoirs">Devoirs</option>
            <option value="Examens">Examens</option>
          </select>
        </div>
      </div>
      <div class="files-list" id="filesList">
        <div class="empty">Chargement...</div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDnrW6WnmbEFpbWzlW9IGglxAafajt2Kyo",
      authDomain: "iset-b9974.firebaseapp.com",
      databaseURL: "https://iset-b9974-default-rtdb.firebaseio.com",
      projectId: "iset-b9974",
      storageBucket: "iset-b9974.firebasestorage.app",
      messagingSenderId: "1054170284751",
      appId: "1:1054170284751:web:8f02232478430d5ae2adba"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const subjectNames = {
      Math: 'Mathématiques',
      Physique: 'Physique',
      Chimie: 'Chimie',
      Anglais: 'Anglais',
      Francais: 'Français',
      Biologie: 'Biologie',
      Microbiologie: 'Microbiologie',
      Genetique: 'Génétique',
      Informatique: 'Informatique',
      Statistique: 'Statistique',
      Francais2: 'Français 2',
      Anglais2: 'Anglais 2',
      GEM: 'GEM',
      GAB: 'GAB',
      PPV: 'PPV',
      TIC: 'TIC',
      STA: 'STA',
      PSA: 'PSA',
      Francais3: 'Français 3',
      EconomieGestion: 'Économie et Gestion',
      Agronomie: 'Agronomie',
      Horticulture: 'Horticulture',
      Pesticides: 'Pesticides',
      Entomologie: 'Entomologie',
      ScienceSols: 'Science des Sols',
      SciencePlantes: 'Science des Plantes',
      Vulgarisation: 'Vulgarisation',
      TechniquePropagation: 'Technique de propagation',
      TechniqueIrrigation: "Technique d'irrigation",
      Ecophysiologie: 'Ecophysiologie végétale',
      BiochimieStructurale: 'Biochimie structurale',
      FertiliteSol: 'Fertilité du sol',
      MethodesDiagnostic: 'Méthodes de diagnostic',
      Malherbologie: 'Malherbologie',
      BesoinEau: 'Besoin en eau',
      ResistanceMateriaux: 'Résistance de matériaux',
      EnergieRenouvelable: 'Énergie renouvelable',
      Environnement: 'Environnement',
      Topographie: 'Topographie',
      DAO: 'DAO',
      MecaniqueFluides: 'Mécanique de fluides',
      ChimieEau: "Chimie de l'eau",
      Automatique: 'Automatique',
      Automatisme: 'Automatisme',
      ProcedeFabrication: 'Procédé de fabrication mécanique',
      Electronique: 'Électronique',
      DessinIndustriel: 'Dessin industriel',
      ResistanceMateriauxGEM: 'Résistance de matériaux (GEM)',
      SchemasCablage: 'Schémas et câblage électrique',
      SciencesMateriaux: 'Sciences de matériaux',
      TechnologieConstruction: 'Technologie de construction mécanique',
      Metrologie: 'Métrologie capteur instrumentation',
      Refrigeration: 'Réfrigération climatisation ventilation',
      Electrotechnique: 'Électrotechnique',
      MoteurCombustion: 'Moteur à combustion interne',
      // S5
      DroitSanteSecurite: 'Droit Santé et sécurité au travail',
      TechniqueGestionEntrepreneuriat: 'Technique de gestion et entreprenariat',
      SystemeProduction: 'Système de Production',
      Arboriculture: 'Arboriculture',
      ConduiteCalibrage: 'Conduite et Calibrage',
      Phytopathologie1: 'Phytopathologie 1',
      GestionConservationSolEau: "Gestion et conservation du sol et de l'eau",
      EnnemisCultures: 'Ennemis des cultures et lutte intégrée',
      PaysageCulturesOrnementales: 'Intro au paysage et cultures ornementales',
      // S6
      RedactionRapports: 'Rédaction et édition des rapports',
      AmeliorationGenetique: 'Amélioration génétique des plantes et biotechnologie',
      Agroenvironnement: 'Agroenvironnement et agriculture de précision',
      Phytopathologie2: 'Phytopathologie 2',
      AdaptationClimat: 'Adaptation au changement climatique et agriculture durable',
      AmenagementPaysager: 'Aménagement paysager et poste récolte'
    };

    document.getElementById('subject').addEventListener('change', function () {
      document.getElementById('gemAspectGroup').style.display =
        this.value === 'GEM' ? 'block' : 'none';
    });

    function showStatus(msg, type) {
      var el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
      setTimeout(function () { el.className = 'status'; }, 4000);
    }

    function getPath(subject, type, gemAspect) {
      if (subject === 'GEM' && gemAspect) {
        return 'files/GEM/' + gemAspect + '/' + type;
      }
      return 'files/' + subject + '/' + type;
    }

    async function addFile() {
      var subject = document.getElementById('subject').value;
      var type = document.getElementById('fileType').value;
      var name = document.getElementById('fileName').value.trim();
      var url = document.getElementById('fileUrl').value.trim();
      var gemAspect = document.getElementById('gemAspect').value;

      if (!name || !url) {
        showStatus('Veuillez remplir le nom et le lien', 'error');
        return;
      }

      var path = getPath(subject, type, gemAspect);
      try {
        await db.ref(path).push({ name: name, url: url });
        showStatus('Fichier ajouté avec succès !', 'success');
        document.getElementById('fileName').value = '';
        document.getElementById('fileUrl').value = '';
        loadFiles();
      } catch (e) {
        showStatus('Erreur : ' + e.message, 'error');
      }
    }

    async function loadFiles() {
      var list = document.getElementById('filesList');
      list.innerHTML = '<div class="empty">Chargement...</div>';

      var filterSubject = document.getElementById('filterSubject').value;
      var filterType = document.getElementById('filterType').value;

      try {
        var snapshot = await db.ref('files').once('value');
        var data = snapshot.val() || {};
        var files = [];

        for (var subjectKey in data) {
          if (subjectKey === 'GEM') {
            var gemData = data[subjectKey] || {};
            for (var aspect in gemData) {
              var aspectData = gemData[aspect] || {};
              for (var type in aspectData) {
                var typeData = aspectData[type] || {};
                for (var key in typeData) {
                  var file = typeData[key];
                  files.push({
                    subject: 'GEM',
                    gemAspect: aspect,
                    type: type,
                    name: file.name,
                    url: file.url,
                    path: 'files/GEM/' + aspect + '/' + type + '/' + key
                  });
                }
              }
            }
          } else {
            var subjectData = data[subjectKey] || {};
            for (var type2 in subjectData) {
              var typeData2 = subjectData[type2] || {};
              for (var key2 in typeData2) {
                var file2 = typeData2[key2];
                files.push({
                  subject: subjectKey,
                  gemAspect: '',
                  type: type2,
                  name: file2.name,
                  url: file2.url,
                  path: 'files/' + subjectKey + '/' + type2 + '/' + key2
                });
              }
            }
          }
        }

        // تعبئة الفلتر بكل المواد
        var filterSel = document.getElementById('filterSubject');
        if (filterSel.options.length <= 1) {
          var allSubjects = Object.keys(subjectNames).sort();
          allSubjects.forEach(function (s) {
            var opt = document.createElement('option');
            opt.value = s;
            opt.textContent = subjectNames[s] || s;
            filterSel.appendChild(opt);
          });
        }

        if (filterSubject) {
          files = files.filter(function (f) { return f.subject === filterSubject; });
        }
        if (filterType) {
          files = files.filter(function (f) { return f.type === filterType; });
        }

        if (files.length === 0) {
          list.innerHTML = '<div class="empty">Aucun fichier trouvé</div>';
          return;
        }

        var html = '';
        files.forEach(function (f) {
          var displaySubject = subjectNames[f.subject] || f.subject;
          html += '<div class="file-item">' +
            '<div class="file-info">' +
              '<div class="file-name">' + f.name + '</div>' +
              '<div class="file-meta">' +
                '<span class="badge ' + f.type.toLowerCase() + '">' + f.type + '</span>' +
                displaySubject + (f.gemAspect ? ' / ' + f.gemAspect : '') +
              '</div>' +
            '</div>' +
            '<button class="danger" onclick="deleteFile(\'' + f.path + '\')">Supprimer</button>' +
          '</div>';
        });
        list.innerHTML = html;
      } catch (e) {
        list.innerHTML = '<div class="empty">Erreur : ' + e.message + '</div>';
      }
    }

    async function deleteFile(path) {
      if (!confirm('Supprimer ce fichier ?')) return;
      try {
        await db.ref(path).remove();
        showStatus('Fichier supprimé', 'success');
        loadFiles();
      } catch (e) {
        showStatus('Erreur : ' + e.message, 'error');
      }
    }

    loadFiles();
  </script>
</body>
</html>
